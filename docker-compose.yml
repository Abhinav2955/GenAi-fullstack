services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: genai_resume
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d genai_resume"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
